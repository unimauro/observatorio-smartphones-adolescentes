<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0b1220"/>
  <rect width="1200" height="8" fill="#2dd4bf"/>

  <text x="70" y="116" font-size="54" font-weight="700" fill="#f1f5f9">Observatorio <tspan fill="#2dd4bf">Adolescentes &amp; Pantallas</tspan></text>
  <text x="72" y="160" font-size="25" fill="#94a3b8">Evidencia científica y datos abiertos sobre adolescentes</text>

  <!-- Chips -->
  <g font-size="22" fill="#cbd5e1">
    <rect x="72" y="196" width="150" height="44" rx="8" fill="#111929" stroke="#26324a"/>
    <text x="92" y="225">28 países</text>
    <rect x="238" y="196" width="166" height="44" rx="8" fill="#111929" stroke="#26324a"/>
    <text x="258" y="225">12 estudios</text>
    <rect x="420" y="196" width="166" height="44" rx="8" fill="#111929" stroke="#26324a"/>
    <text x="440" y="225">10 módulos</text>
  </g>

  <!-- Bullets de módulos -->
  <g font-size="23">
    <text x="72" y="312" fill="#818cf8">● Panorama mundial · mapa interactivo</text>
    <text x="72" y="350" fill="#fb7185">● Salud mental · correlaciones</text>
    <text x="72" y="388" fill="#fbbf24">● Riesgos digitales · familia · educación</text>
    <text x="72" y="426" fill="#34d399">● LATAM · Perú · biblioteca con DOI</text>
  </g>

  <!-- Sello de rigor -->
  <rect x="70" y="468" width="430" height="58" rx="29" fill="#111929" stroke="#2dd4bf" stroke-width="2"/>
  <text x="98" y="504" font-size="22" font-weight="600" fill="#2dd4bf">Correlación ≠ causalidad · fuentes citadas</text>

  <!-- Panel derecho: smartphone + datos -->
  <g>
    <rect x="760" y="150" width="370" height="300" rx="16" fill="#111929" stroke="#26324a"/>
    <rect x="900" y="180" width="90" height="180" rx="12" fill="#0b1220" stroke="#2dd4bf" stroke-width="2"/>
    <circle cx="945" cy="196" r="2.5" fill="#2dd4bf"/>
    <!-- barras dentro -->
    <rect x="912" y="300" width="14" height="50" fill="#38bdf8"/>
    <rect x="930" y="275" width="14" height="75" fill="#34d399"/>
    <rect x="948" y="288" width="14" height="62" fill="#fbbf24"/>
    <rect x="966" y="260" width="14" height="90" fill="#fb7185"/>
    <text x="792" y="410" font-size="16" fill="#64748b">tiempo de pantalla · bienestar · riesgos</text>
  </g>

  <!-- Footer -->
  <text x="72" y="588" font-size="21" fill="#64748b">unimauro.github.io/observatorio-smartphones-adolescentes</text>
  <text x="1130" y="588" font-size="21" fill="#64748b" text-anchor="end">por Carlos Cárdenas Fernández · @unimauro</text>
</svg>
